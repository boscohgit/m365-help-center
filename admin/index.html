<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M365 本地内容后台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">M</span>
        <div><strong>M365 内容后台</strong><small>仅在本机运行</small></div>
      </div>
      <div class="top-actions">
        <span id="save-state" class="state-pill">正在载入…</span>
        <button id="save-button" class="button secondary">保存草稿</button>
        <button id="preview-button" class="button secondary">刷新预览</button>
        <button id="publish-button" class="button primary">发布到 GitHub</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="guide-sidebar">
        <div class="sidebar-head">
          <div class="sidebar-title-row">
            <label for="guide-search">指引列表</label>
            <button id="new-guide-button" type="button">+ 新建 SOP</button>
          </div>
          <input id="guide-search" type="search" placeholder="搜索标题…" />
        </div>
        <nav id="guide-list" aria-label="指引列表"></nav>
      </aside>

      <main class="editor-shell">
        <div id="editor-empty" class="empty-state">请选择一篇指引。</div>
        <form id="editor" hidden></form>
      </main>

      <aside class="preview-shell">
        <div class="preview-head">
          <div><strong>实时预览</strong><small>保存后自动更新</small></div>
          <a id="open-preview" href="#" target="_blank" rel="noopener">新窗口打开</a>
        </div>
        <iframe id="preview-frame" title="网站实时预览"></iframe>
      </aside>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <dialog id="new-guide-dialog" class="new-guide-dialog">
      <form id="new-guide-form">
        <div class="dialog-head">
          <div>
            <strong>新建 SOP</strong>
            <small>创建后会自动进入网站列表和搜索，发布前可以继续完善内容。</small>
          </div>
          <button id="new-guide-close" type="button" class="icon-button" aria-label="关闭">×</button>
        </div>
        <div class="new-guide-fields">
          <label class="field full">
            <span>SOP 标题</span>
            <input name="title" required maxlength="120" placeholder="例如：连接公司 VPN" />
          </label>
          <label class="field full">
            <span>网址标识（小写英文）</span>
            <input name="slug" required maxlength="80" pattern="[a-z0-9][a-z0-9-]*" placeholder="例如：connect-vpn" />
            <small>创建后不能修改；网页地址会使用这个标识。</small>
          </label>
          <label class="field">
            <span>分类</span>
            <select name="category">
              <option>账号与安全</option>
              <option>Office 应用</option>
              <option>Outlook 邮箱</option>
              <option>Teams</option>
              <option>OneDrive 与 SharePoint</option>
              <option>设备与工具</option>
            </select>
          </label>
          <label class="field">
            <span>适用设备</span>
            <input name="device" value="电脑或手机" />
          </label>
          <label class="field full">
            <span>副标题</span>
            <input name="subtitle" placeholder="用几个关键词说明这篇 SOP" />
          </label>
          <label class="field full">
            <span>页面介绍</span>
            <textarea name="description" rows="3" placeholder="用户看完这篇 SOP 可以解决什么问题？"></textarea>
          </label>
        </div>
        <div class="dialog-actions">
          <button id="new-guide-cancel" type="button" class="button secondary">取消</button>
          <button id="new-guide-submit" type="submit" class="button primary">创建并开始编辑</button>
        </div>
      </form>
    </dialog>

    <dialog id="redact-dialog">
      <div class="dialog-head">
        <div><strong>上传前脱敏</strong><small>在姓名、邮箱、电话、密码、验证码和二维码上拖动画框</small></div>
        <button id="redact-close" class="icon-button" aria-label="关闭">×</button>
      </div>
      <div class="canvas-wrap"><canvas id="redact-canvas"></canvas></div>
      <div class="dialog-actions">
        <span id="redact-count">尚未添加遮挡区域</span>
        <button id="redact-undo" class="button secondary">撤销一个框</button>
        <button id="redact-clear" class="button secondary">清除全部</button>
        <button id="redact-save" class="button primary">完成并添加图片</button>
      </div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
